# Render Web Service — Postgres is Neon (set DATABASE_URL in dashboard).
# https://dashboard.render.com → New → Blueprint, or create Web Service manually.
services:
  - type: web
    name: star-autos-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ON_START
        value: "true"
      - key: SEED_RESET
        value: "false"
      - key: TYPEORM_SYNC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
